<head>
  <!-- Add Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<link href="/book_app/style.css" rel="stylesheet" />
<body class="bg-gradient-to-b from-slate-50 to-slate-100 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-6xl">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
      
      <!-- Header -->
      <div class="bg-teal-600 px-8 py-6 flex flex-col sm:flex-row items-center justify-between gap-4">
        <h2 class="text-3xl font-semibold text-white">📚 Book Collection</h2>
        <a
          href="{% url 'book_create' %}"
          class="px-5 py-2 rounded-lg font-medium text-white bg-teal-700 hover:bg-teal-800 shadow transition duration-200"
        >
          + Add Book
        </a>
      </div>

      <!-- Search bar -->
      <div class="p-6 border-b flex border-slate-100 bg-slate-50">
        <form method="get" class="w-full max-w-md mx-auto flex gap-4">
          <input
            type="text"
            name="q"
            placeholder="Search by title or author"
            value="{{ request.GET.q }}"
            class="flex-1 bg-white border border-slate-300 text-sm rounded-lg px-4 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-teal-400 focus:border-teal-400 transition"
          />
          <select
            name="sort"
            onchange="this.form.submit()"
            class="bg-white border border-slate-300 text-sm rounded-lg px-3 py-2"
          >
            <option value="newest" {% if request.GET.sort == 'newest' %}selected{% endif %}>Newest First</option>
            <option value="oldest" {% if request.GET.sort == 'oldest' %}selected{% endif %}>Oldest First</option>
          </select>
        </form>

      </div>

      <!-- Book Cards -->
      {% if books %}
      <div class="p-6">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          {% for book in books %}
          <div
            class="bg-white border border-slate-200 rounded-xl p-6 shadow hover:shadow-lg transition duration-300"
          >
            <div class="border-l-4 border-teal-500 pl-4">
              <h3 class="text-lg font-semibold text-slate-800 mb-1">
                {{ book.title }}
              </h3>
              <p class="text-slate-600 text-sm mb-1">by {{ book.author }}</p>
              <p class="text-slate-500 text-sm mb-4">
                Published: {{ book.published_date }}
              </p>
              <div class="flex justify-end gap-3 pt-2">
                <a
                  href="{% url 'book_update' pk=book.pk %}"
                  class="text-sm px-3 py-1 rounded bg-teal-50 text-teal-700 hover:bg-teal-100 transition"
                >
                  Edit
                </a>
                <a
                  href="{% url 'book_delete' pk=book.pk %}"
                  class="text-sm px-3 py-1 rounded bg-rose-50 text-rose-600 hover:bg-rose-100 transition"
                >
                  Delete
                </a>
              </div>
            </div>
          </div>
          {% endfor %}
        </div>
      </div>
      {% else %}
      <!-- Empty State -->
      <div class="text-center py-20">
        <svg
          class="mx-auto h-14 w-14 text-slate-300"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
          />
        </svg>
        <h3 class="mt-4 text-xl font-semibold text-slate-700">
          No books available
        </h3>
        <p class="mt-1 text-slate-500">Get started by adding your first book</p>
        <div class="mt-6">
          <a
            href="{% url 'book_create' %}"
            class="px-5 py-2 rounded-lg font-medium text-white bg-teal-600 hover:bg-teal-700 shadow transition"
          >
            Add Your First Book
          </a>
        </div>
      </div>
      {% endif %}
    </div>
  </div>
</body>
