<head>
  <!-- Add Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<link href="/book_app/style.css" rel="stylesheet" />

<div
  class="min-h-screen w-full flex items-center justify-center bg-gradient-to-b from-slate-50 to-slate-100 p-4"
>
  <div class="w-full max-w-2xl">
    <div
      class="bg-white rounded-xl overflow-hidden shadow-lg border border-slate-100"
    >
      <div class="bg-teal-500 p-6">
        <h2 class="text-2xl font-medium text-white">
          {% if form.instance.pk %}Edit Book{% else %}Add Book{% endif %}
        </h2>
      </div>

      <div class="p-8">
        <form method="post" enctype="multipart/form-data" class="space-y-6">
          {% csrf_token %} {% for field in form %}
          <div class="space-y-2">
            <label
              for="{{ field.id_for_label }}"
              class="block text-sm font-medium text-slate-700 mb-1"
            >
              {{ field.label }}
            </label>
            <input
              type="{% if field.name == 'published_date' %}date{% else %}{{ field.field.widget.input_type|default:'text' }}{% endif %}"
              name="{{ field.name }}"
              id="{{ field.id_for_label }}"
              value="{% if field.name == 'published_date' and field.value %}{{ field.value|date:'Y-m-d' }}{% else %}{{ field.value|default:'' }}{% endif %}"
              class="w-full bg-slate-50 border border-slate-200 rounded-lg shadow-sm text-slate-800 py-3 px-4 focus:ring-2 focus:ring-teal-500/50 focus:border-teal-500 focus:outline-none transition-all duration-200"
              {%
              if
              field.field.required
              %}required{%
              endif
              %}
            />
            {% if field.help_text %}
            <p class="mt-1 text-sm text-slate-500">{{ field.help_text }}</p>
            {% endif %} {% if field.errors %}
            <p class="text-sm text-rose-500">{{ field.errors }}</p>
            {% endif %}
          </div>
          {% endfor %}

          <div class="mt-8 flex justify-end space-x-4">
            <a
              href="{% url 'book_list' %}"
              class="px-5 py-2 rounded-lg text-slate-600 font-medium border border-slate-200 bg-white hover:bg-slate-50 hover:text-slate-800 transition-all duration-200"
            >
              Cancel
            </a>
            <button
              type="submit"
              class="px-5 py-2 rounded-lg font-medium text-white bg-teal-500 hover:bg-teal-600 shadow-sm transition-all duration-200"
            >
              Save Book
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
